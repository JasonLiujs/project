<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>GitNexus</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Outfit:wght@300;400;500;600;700&display=swap"
      rel="stylesheet"
    />
    <style>
      a[href="https://github.com/sponsors/abhigyanpatwari"] {
        display: none !important;
      }
    </style>
    <script type="module" crossorigin src="./assets/index-JtSSLa-M.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-ClzIPKH0.css">
  </head>
  <body>
    <div id="root"></div>
    <script>
      (function () {
        var sponsorHref = "https://github.com/sponsors/abhigyanpatwari";

        function removeSponsor() {
          var sponsor = document.querySelector('a[href="' + sponsorHref + '"]');
          if (sponsor) {
            sponsor.remove();
          }
        }

        removeSponsor();

        var observer = new MutationObserver(function () {
          removeSponsor();
        });

        observer.observe(document.documentElement, {
          childList: true,
          subtree: true,
        });

        window.addEventListener("beforeunload", function () {
          observer.disconnect();
        });
      })();
    </script>
  </body>
</html>
